# Cloud Run service — production. Applied by .github/workflows/deploy.yml:
#   envsubst < deploy/service.yaml | gcloud run services replace -
# See how_to_deploy_website.md §5.
#
# Phase 0 (coming-soon page): no database, no object storage, no secrets.
# The commented block below is wired in as those arrive.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  labels:
    cloud.googleapis.com/location: ${REGION}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"   # cost: idle to zero
        autoscaling.knative.dev/maxScale: "3"   # cost: HARD ceiling on burn rate — see §7.4
    spec:
      serviceAccountName: ${RUNTIME_SA}
      containerConcurrency: 80                  # cost: more req/instance = fewer instances
      timeoutSeconds: 30                        # cost: caps how long a slow client holds capacity
      containers:
        - image: ${IMAGE}                       # always a digest, never a tag
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: production
            # --- Add as each backing service arrives (see §5) --------------
            # - name: DATABASE_URL
            #   valueFrom: { secretKeyRef: { name: DATABASE_URL, key: latest } }
            # - name: S3_ENDPOINT
            #   value: https://<accountid>.r2.cloudflarestorage.com
            # - name: ORIGIN_SHARED_SECRET
            #   valueFrom: { secretKeyRef: { name: ORIGIN_SHARED_SECRET, key: latest } }
            # ---------------------------------------------------------------
          startupProbe:
            httpGet: { path: /healthz }
            periodSeconds: 2
            failureThreshold: 15
  traffic:
    - percent: 100
      latestRevision: true
