name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy in flight — a half-applied change is worse than a queue.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until CLOUDFLARE_ACCOUNT_ID is set, so the workflow is green on a
    # fresh clone rather than red.
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke check
        run: |
          curl -fsS --retry 5 --retry-all-errors https://madebyanirudha.in/ \
            | grep -q "made by" || { echo "::error::live site did not render"; exit 1; }
          {
            echo "### Deployed"
            echo "- https://madebyanirudha.in"
            echo "- commit \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
