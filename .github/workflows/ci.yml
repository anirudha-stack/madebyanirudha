name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Needs no Cloudflare credentials. Green on a fresh clone, before any setup.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Parses wrangler.jsonc and builds the asset manifest without any network
      # call or credential. Catches a malformed config before it reaches main.
      - name: Validate Worker config
        run: npx wrangler deploy --dry-run

      - name: Page still renders
        run: |
          grep -q "made by" public/index.html \
            || { echo "::error::index.html lost its content"; exit 1; }

  # Uploads a preview version and comments the URL on the PR.
  # Skipped until CLOUDFLARE_ACCOUNT_ID is set (see how_to_deploy_website.md §5).
  preview:
    needs: validate
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A version is uploaded but takes no traffic — production keeps serving
      # whatever `deploy` last promoted.
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload 2>&1 | tee out.txt
          URL=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev' out.txt | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        if: steps.upload.outputs.url != ''
        with:
          script: |
            const url = '${{ steps.upload.outputs.url }}';
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n**Preview:** ${url}\n\n<sub>version from \`${{ github.sha }}\`</sub>`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const hit = comments.find(c => c.body?.includes(marker));
            if (hit) await github.rest.issues.updateComment({ ...context.repo, comment_id: hit.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
