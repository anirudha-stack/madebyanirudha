name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  AR_REPO: ${{ vars.AR_REPO || 'web' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'website' }}
  PREVIEW_SERVICE: ${{ vars.PREVIEW_SERVICE_NAME || 'website-preview' }}

jobs:
  # Needs no cloud credentials. Green on a fresh clone, before any GCP setup.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container serves /healthz
        run: |
          docker run -d --name ci -p 8080:8080 -e PORT=8080 app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -fsS http://localhost:8080/ | grep -q "made by" || { echo "::error::page did not render"; exit 1; }
              docker rm -f ci; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"; docker logs ci; exit 1

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:ci
          severity: HIGH,CRITICAL
          exit-code: '0'      # report only; flip to '1' to gate once a baseline exists

  # Skipped until the GCP setup in how_to_deploy_website.md §4 is complete.
  preview:
    needs: build
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tagged revisions with --no-traffic are inherently imperative.
      # Production stays declarative via deploy/service.yaml.
      - name: Deploy preview revision
        id: deploy
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}@${{ steps.push.outputs.digest }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          gcloud run deploy "$PREVIEW_SERVICE" \
            --image "$IMAGE" --region "$REGION" \
            --tag "$TAG" --no-traffic --allow-unauthenticated \
            --min-instances 0 --max-instances 1 --quiet
          URL=$(gcloud run services describe "$PREVIEW_SERVICE" --region "$REGION" --format=json \
                | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag==$t) | .url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fsS --retry 5 --retry-all-errors "$URL/healthz" >/dev/null

      - uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n**Preview:** ${url}\n\n<sub>revision \`${{ github.sha }}\`</sub>`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const hit = comments.find(c => c.body?.includes(marker));
            if (hit) await github.rest.issues.updateComment({ ...context.repo, comment_id: hit.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
